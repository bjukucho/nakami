<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>投信中身マップ</title><meta name="description" content="持っている投資信託・ETFの中身（構成銘柄）を合算して、どの会社にいくら投資しているかがひと目で分かります。"><meta property="og:type" content="website"><meta property="og:url" content="https://bjukucho.github.io/nakami/"><meta property="og:title" content="投信中身マップ"><meta property="og:description" content="持っている投資信託・ETFの中身（構成銘柄）を合算して、どの会社にいくら投資しているかがひと目で分かります。"><meta property="og:image" content="https://bjukucho.github.io/nakami/ogp.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="投信中身マップ"><meta name="twitter:description" content="持っている投資信託・ETFの中身（構成銘柄）を合算して、どの会社にいくら投資しているかがひと目で分かります。"><meta name="twitter:image" content="https://bjukucho.github.io/nakami/ogp.png"><link rel="icon" href="favicon.png" sizes="48x48" type="image/png"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="besuko"><meta name="theme-color" content="#1f6b45"><style>
:root{--bg:#f6f7f4;--surface:#fff;--ink:#151714;--ink-2:#4f544c;--muted:#868b82;--line:#cdd2c6;--accent:#1f6b45;--down:#b3392f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121411;--surface:#1b1e1a;--ink:#eef0ea;--ink-2:#c1c6bb;--muted:#8c9187;--line:#3a3f37;--accent:#5fbf88;--down:#ef7b70;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:21px}
p{margin:0;color:var(--ink-2);font-size:14px}
input{font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
button{font:inherit;font-size:16px;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{color:var(--down);font-size:13.5px;min-height:1.2em}
.hint{color:var(--muted);font-size:13px}.hint a{color:var(--accent)}
</style></head><body>
<form class="box" id="f" hidden autocomplete="off">
<h1>投信中身マップ</h1>
<p id="lead">合言葉を入れると開きます。</p>
<input id="w" type="text" inputmode="text" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="合言葉" placeholder="合言葉">
<div class="msg" id="msg" role="alert"></div>
<button id="b" type="submit">開く</button>
<p class="hint">合言葉は <a href="https://x.com/besuko_" target="_blank" rel="noopener">@besuko_</a> の固定ポストのリプ欄にあります。</p>
</form>
<script>
(function(){
  var P={"s": "evKhAJ3mR8wvvOLK1bTtWA==", "i": "f13R9lLPPXnA0PYV", "n": 200000},V="YmYTO83Y";
  var K='nakami-word';
  function norm(s){s=String(s||'').normalize('NFKC').trim().toLowerCase().replace(/\s+/g,'');return s.replace(/[\u30a1-\u30f6]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});}
  function bin(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  var WEEK=7*24*60*60*1000,DATA=null;
  function get(){try{var o=JSON.parse(localStorage.getItem(K)||'null');return o&&o.w?o:null;}catch(e){return null;}}
  function put(v){try{localStorage.setItem(K,JSON.stringify({w:v,t:Date.now()}));}catch(e){}}
  async function open(word){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(word),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bin(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    if(!DATA){var r=await fetch('app.dat?v='+V,{cache:'no-cache'});if(!r.ok)throw new Error('net');DATA=new Uint8Array(await r.arrayBuffer());}
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(P.i)},key,DATA);
    return new TextDecoder().decode(buf);
  }
  // アクセス数（GoatCounter）：入口を開いた回数と、合言葉で開いた回数だけを送る。入力した投信や金額は送らない
  function gc(path,title,ev){try{var u='https://nakami.goatcounter.com/count?p='+encodeURIComponent(path)+'&t='+encodeURIComponent(title)+(ev?'&e=true':'')+'&r='+encodeURIComponent(document.referrer||'')+'&s='+screen.width+','+screen.height+','+(window.devicePixelRatio||1)+'&rnd='+Math.random().toString(36).slice(2);var i=new Image();return new Promise(function(res){var d=false,f=function(){if(!d){d=true;res();}};i.onload=i.onerror=f;setTimeout(f,700);i.src=u;});}catch(e){return Promise.resolve();}}
  gc('/','投信中身マップ（入口）',false);
  function show(html){document.open();document.write(html);document.close();}
  var f=document.getElementById('f'),w=document.getElementById('w'),b=document.getElementById('b'),msg=document.getElementById('msg');
  function form(text){f.hidden=false;if(text)document.getElementById('lead').textContent=text;w.focus();}
  f.addEventListener('submit',async function(e){
    e.preventDefault();var v=norm(w.value);if(!v){msg.textContent='合言葉を入れてください。';return;}
    b.disabled=true;msg.textContent='';
    try{var html=await open(v);put(v);await gc('unlock','合言葉を入れて開いた',true);show(html);}
    catch(err){b.disabled=false;msg.textContent=!(window.crypto&&crypto.subtle)?'このブラウザでは開けません。Safari や Chrome の新しい版で開いてください。':(err&&err.message==='net')?'読み込めませんでした。電波のよい所でもう一度お試しください。':'合言葉が違います。';}
  });
  var saved=get();
  if(saved&&window.crypto&&crypto.subtle){
    if(Date.now()-(saved.t||0)>=WEEK) form('1週間たったので、もう一度合言葉を入れてください。');
    else open(saved.w).then(function(html){gc('auto-open','保存した合言葉で開いた',true).then(function(){show(html);});},function(err){form((err&&err.message==='net')?'読み込めませんでした。電波のよい所で、合言葉を入れてもう一度お試しください。':'合言葉が新しくなりました。新しい合言葉を入れてください。');});
  }
  else form();
})();
</script></body></html>
